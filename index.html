<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RAAIN — Fashion for Now and Forever</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    background:radial-gradient(130% 100% at 50% 0%, #93B4C7 0%, #7399AE 45%, #577E95 100%);
    background-attachment:fixed;
  }
  body {
    font-family:"Plus Jakarta Sans", sans-serif;
    color:#1E293B;
    min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:28px 16px;
  }

  html.has-dot-cursor, html.has-dot-cursor * { cursor:none !important; }

  /* ---------- white frame ---------- */
  .frame {
    width:100%; max-width:1248px;
    background:#FDFEFE;
    border-radius:28px;
    padding:14px;
    box-shadow:0 40px 90px -30px rgba(18,42,63,.5), inset 0 0 0 1px rgba(255,255,255,.7);
  }

  /* ---------- nav bar — its own separate bar ---------- */
  .navbar {
    position:relative; z-index:30;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    min-height:66px;
    padding:10px 26px;
    background:linear-gradient(180deg, #F8FAFB, #EEF3F5);
    border-radius:18px;
    box-shadow:inset 0 0 0 1px rgba(30,41,59,.05);
  }
  nav.links { display:flex; gap:28px; }
  nav.links a {
    font-size:12px; font-weight:600; letter-spacing:.6px;
    color:#475569; text-decoration:none;
  }
  nav.links a:first-child { color:#0F172A; }
  nav.links a:hover { color:#0F172A; }

  .logo {
    position:absolute; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px;
    font-family:"Nunito", sans-serif; font-weight:900; font-size:19px; letter-spacing:3px; color:#0F172A;
  }
  .logo .diamond { font-size:15px; letter-spacing:0; }

  /* Shiny Pill (OriginKit) — sheen sweep across text, endless loop */
  .shiny {
    background:linear-gradient(110deg, #0F172A 42%, #8FC3E4 50%, #0F172A 58%);
    background-size:220% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    animation:shiny-sweep 4.5s linear infinite;
  }
  @keyframes shiny-sweep { 0%{background-position:130% 0} 100%{background-position:-90% 0} }

  .head-right { display:flex; align-items:center; gap:14px; margin-left:auto; }
  .search {
    width:224px; height:32px; border-radius:999px;
    background:rgba(255,255,255,.85);
    box-shadow:inset 0 0 0 1px rgba(30,41,59,.07);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 10px 0 17px;
    font-size:12px; color:#94A3B8;
  }
  .cart {
    position:relative; width:50px; height:28px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    color:#334155; background:none; border:0; font-family:inherit;
  }
  .cart .badge {
    width:16px; height:16px; border-radius:999px; background:#334155; color:#fff;
    font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .profile { display:flex; align-items:center; gap:9px; font-size:12px; font-weight:500; color:#334155; }
  .profile img { width:28px; height:28px; border-radius:999px; object-fit:cover; object-position:top; }

  /* ---------- hero panel — separate section under the nav bar ---------- */
  .hero {
    position:relative;
    margin-top:14px;
    border-radius:22px;
    overflow:hidden;
    min-height:748px;
    display:flex; flex-direction:column;
    padding:46px 48px 30px 48px;
    background:radial-gradient(120% 90% at 75% 20%, #D8EBF3 0%, #B8D6E3 45%, #9FC3D9 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);
  }

  .watermark {
    position:absolute; z-index:1;
    top:272px; left:50%; transform:translateX(-50%);
    font-family:"Bebas Neue", sans-serif; font-weight:400;
    font-size:min(360px, 28.8vw); line-height:1; letter-spacing:14px;
    color:rgba(255,255,255,.48);
    user-select:none; pointer-events:none; white-space:nowrap;
    animation:wm-in 1.6s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes wm-in { from{opacity:0; transform:translateX(-50%) scale(1.05)} to{opacity:1; transform:translateX(-50%) scale(1)} }

  /* the rotating mannequin — centre stage, in front of the watermark */
  .stage-zone {
    position:absolute; z-index:5;
    left:50%; transform:translateX(-50%);
    top:66px;
    height:604px; max-height:82%;
    aspect-ratio:820 / 1056;
    touch-action:pan-y;
  }
  .stage-video {
    width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 34px 28px rgba(28,57,84,.28));
    pointer-events:none;
    animation:stage-in 1.1s cubic-bezier(.22,1,.36,1) .25s both;
  }
  @keyframes stage-in { from{opacity:0; transform:translateY(30px)} to{opacity:1; transform:translateY(0)} }
  .stage-hint {
    position:absolute; left:50%; bottom:-24px; transform:translateX(-50%);
    font-size:9px; font-weight:600; letter-spacing:2.6px; color:rgba(71,85,105,.55);
    white-space:nowrap; user-select:none; pointer-events:none;
    animation:fade-up .8s ease 1.2s both;
  }

  h1 {
    position:relative; z-index:2;
    font-family:"Bebas Neue", sans-serif; font-weight:400;
    font-size:clamp(64px, 17vw, 214px); line-height:.94; letter-spacing:2px;
    width:100%; max-width:none; text-align:center; color:#FFFFFF;
  }
  /* Mask Text Reveal (OriginKit) — lines rise out of a clip mask, staggered */
  h1 .line { display:block; overflow:hidden; }
  h1 .line > span {
    display:block;
    background:linear-gradient(180deg, #FFFFFF 30%, rgba(255,255,255,.66));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:line-rise .95s cubic-bezier(.22,1,.36,1) both;
  }
  h1 .line:nth-child(1) > span { animation-delay:.05s }
  h1 .line:nth-child(2) > span { animation-delay:.14s }
  @keyframes line-rise { from{transform:translateY(112%)} to{transform:translateY(0)} }

  @keyframes fade-up { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }

  #dot-cursor-canvas { position:fixed; inset:0; z-index:9999; pointer-events:none; }

  @media (max-width:900px) {
    body { padding:14px 8px; }
    .frame { padding:10px; border-radius:22px; }
    .navbar { padding:12px 16px; flex-wrap:wrap; border-radius:14px; min-height:0; }
    .logo { position:static; transform:none; order:-1; }
    nav.links { gap:18px; }
    nav.links a { font-size:11px; }
    .search { display:none; }
    .hero { min-height:0; padding:28px 20px 22px; border-radius:18px; margin-top:10px; }
    .watermark { font-size:34vw; letter-spacing:12px; top:290px; }
    h1 { line-height:1; width:100%; order:1; }
    .stage-zone { position:relative; top:0; height:440px; margin:6px auto -6px; order:2; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
  <main class="frame">
    <header class="navbar">
      <nav class="links">
        <a href="#" data-cursor="link">HOME</a><a href="#" data-cursor="link">SHOP</a><a href="#" data-cursor="link">CATALOG</a><a href="#" data-cursor="link">FAQ</a><a href="#" data-cursor="link">CONTACT</a>
      </nav>
      <div class="logo"><span class="diamond">◆</span><span class="shiny">RAAIN</span></div>
      <div class="head-right">
        <div class="search"><span>Search Inventory...</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.4"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg></div>
        <button class="cart" type="button" aria-label="Cart"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2"><path d="M5 8h14l-1.2 12.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3L5 8Z"/><path d="M8.5 10V6.5a3.5 3.5 0 0 1 7 0V10"/></svg><span class="badge">3</span></button>
        <div class="profile"><img src="thumb_0.3.jpg" alt="Gracie Heine"/><span>Gracie Heine</span></div>
      </div>
    </header>

    <section class="hero">
      <div class="watermark">RAAIN</div>

      <div class="stage-zone" id="stageZone" data-cursor="stage" role="button" aria-label="Drag to rotate the mannequin">
        <video class="stage-video" id="stageVideo" autoplay muted loop playsinline poster="poster.png" aria-label="Rotating mannequin wearing the taupe RAAIN set">
          <source src="mannequin-alpha.webm" type="video/webm"/>
        </video>
        <div class="stage-hint">DRAG TO ROTATE</div>
      </div>

      <h1><span class="line"><span>DRESS LIKE</span></span><span class="line"><span>YOU BELONG</span></span></h1>
    </section>
  </main>

<script>
(function(){
  "use strict";
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var finePointer = window.matchMedia("(pointer: fine)").matches;
  var video = document.getElementById("stageVideo");
  var zone = document.getElementById("stageZone");

  /* ============ Stage control: drag-to-spin with inertia ============ */
  var holdUntil = 0;                        // stage stays paused while now < holdUntil
  function dur(){ return video.duration || 7.85; }

  var dragging = false, dragX = 0, dragT = 0, lastX = 0, lastMoveT = 0, vel = 0, inertia = 0, inertiaStart = 0, lastTick = 0;
  zone.addEventListener("pointerdown", function(e){
    dragging = true; inertia = 0; vel = 0;
    dragX = lastX = e.clientX; dragT = video.currentTime; lastMoveT = performance.now();
    video.pause();
    zone.setPointerCapture(e.pointerId);
  });
  zone.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var now = performance.now();
    var d = dur();
    var dt = (dragT + (e.clientX - dragX) / 600 * d) % d; if (dt < 0) dt += d;
    video.currentTime = dt;
    if (now > lastMoveT) vel = 0.7 * vel + 0.3 * ((e.clientX - lastX) / (now - lastMoveT) * 1000); // px/s
    lastX = e.clientX; lastMoveT = now;
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    inertia = vel;                          // px/s, time-decayed in the tick loop
    inertiaStart = performance.now();
    holdUntil = performance.now() + 400;
  }
  zone.addEventListener("pointerup", endDrag);
  zone.addEventListener("pointercancel", endDrag);

  function stageTick(now){
    if (!dragging && inertia !== 0) {
      var el = now - inertiaStart;
      var dtF = Math.min(0.05, (now - (lastTick || now)) / 1000);
      var speed = inertia * Math.exp(-el / 300);          // px/s, ~300ms decay constant
      if (el > 900 || Math.abs(speed) < 18) { inertia = 0; holdUntil = now + 250; }
      else {
        var d2 = dur();
        var t2 = (video.currentTime + speed / 600 * d2 * dtF) % d2; if (t2 < 0) t2 += d2;
        video.currentTime = t2;
        holdUntil = now + 300;
      }
    }
    lastTick = now;
    if (!dragging && video.paused && now > holdUntil && !reduced) video.play();
    requestAnimationFrame(stageTick);
  }
  requestAnimationFrame(stageTick);

  /* ============ Dot Cursor (OriginKit port) ============ */
  // Source constants: FOLLOW_TAU 0.01, SNAPPINESS 10, BORDER_WIDTH 2,
  // HOVER_SCALE 3.3. Re-skinned: navy head, slate trail.
  if (finePointer && !reduced) {
    document.documentElement.classList.add("has-dot-cursor");
    var canvas = document.createElement("canvas");
    canvas.id = "dot-cursor-canvas";
    document.body.appendChild(canvas);
    var ctx = canvas.getContext("2d");
    var W = 0, H = 0;
    function resize(){
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize(); window.addEventListener("resize", resize);
    var SIZE = 13, HEAD = "#1C3954", TRAIL = "#7C9DB5";
    var px = -100, py = -100, dx = -100, dy = -100, seen = false;
    var morph = 0, morphT = 0;              // 0 dot, 1 ring
    var stageM = 0, stageT = 0;             // stage ring + DRAG label
    var linkRect = null, linkM = 0;
    var trail = [];                          // {x,y,t}
    window.addEventListener("pointermove", function(e){
      px = e.clientX; py = e.clientY;
      if (!seen) { dx = px; dy = py; seen = true; }
      var el = document.elementFromPoint(px, py);
      var ring = el && el.closest ? el.closest('a,button,[role="button"]') : null;
      var stage = el && el.closest ? el.closest('[data-cursor="stage"]') : null;
      var link = el && el.closest ? el.closest('[data-cursor="link"]') : null;
      stageT = stage ? 1 : 0;
      morphT = (ring && !stage) ? 1 : 0;
      linkRect = link ? link.getBoundingClientRect() : null;
    });
    var lastT = performance.now();
    (function draw(now){
      var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
      var lag = 1 - Math.exp(-dt / 0.01);
      dx += (px - dx) * lag; dy += (py - dy) * lag;
      var sm = 1 - Math.exp(-dt * 10);
      morph += (morphT - morph) * sm;
      stageM += (stageT - stageM) * sm;
      linkM += ((linkRect ? 1 : 0) - linkM) * sm;
      trail.push({ x: dx, y: dy, t: now });
      while (trail.length && now - trail[0].t > 400) trail.shift();
      ctx.clearRect(0, 0, W, H);
      if (seen) {
        // trail
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        for (var i = 1; i < trail.length; i++) {
          var a = (i / trail.length) * 0.35;
          ctx.strokeStyle = "rgba(124,157,181," + a + ")";
          ctx.lineWidth = 2.5 * (i / trail.length);
          ctx.beginPath(); ctx.moveTo(trail[i-1].x, trail[i-1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
        }
        var rDot = SIZE / 2;
        var rRing = SIZE * 3.3 / 2;
        var rStage = 34;
        var m = Math.max(morph, stageM);
        var r = rDot + (rRing - rDot) * morph + (rStage - rRing) * stageM;
        // underline for text links
        if (linkRect && linkM > 0.02) {
          ctx.strokeStyle = "rgba(28,57,84," + (0.85 * linkM) + ")";
          ctx.lineWidth = 2;
          var uw = linkRect.width * linkM;
          ctx.beginPath();
          ctx.moveTo(linkRect.left + (linkRect.width - uw) / 2, linkRect.bottom + 3);
          ctx.lineTo(linkRect.left + (linkRect.width + uw) / 2, linkRect.bottom + 3);
          ctx.stroke();
        }
        // ring
        if (m > 0.02) {
          ctx.strokeStyle = "rgba(28,57,84," + (0.9 * m) + ")";
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(dx, dy, r, 0, Math.PI * 2); ctx.stroke();
        }
        // dot
        if (m < 0.98) {
          ctx.fillStyle = HEAD;
          ctx.globalAlpha = 1 - m;
          ctx.beginPath(); ctx.arc(dx, dy, Math.max(1.2, rDot * (1 - m)), 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
        }
        // DRAG label on the stage
        if (stageM > 0.05) {
          ctx.fillStyle = "rgba(28,57,84," + (0.9 * stageM) + ")";
          ctx.font = "600 8px 'Plus Jakarta Sans', sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("DRAG", dx, dy);
        }
      }
      requestAnimationFrame(draw);
    })(lastT);
  }
})();
</script>
</body>
</html>
